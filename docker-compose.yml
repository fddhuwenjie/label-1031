services:
  water-simulation:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: water-simulation
    ports:
      - "8081:6080"   # noVNC web interface (映射到8081)
      - "5901:5900"   # VNC port (映射到5901避免冲突)
    environment:
      - DISPLAY=:99
    restart: unless-stopped
    # For GPU acceleration (optional, requires nvidia-docker)
